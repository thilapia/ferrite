[binaries]
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
c_ld = 'lld'

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapped = true

[built-in options]
c_args = ['--target=x86_64-unknown-none-elf']
c_links_args = ['--target=x86_64-unknown-none-elf']